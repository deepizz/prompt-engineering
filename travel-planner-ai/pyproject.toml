[project]
name = "travel_planner"
version = "0.1.0"
description = "AI-powered Travel Planner built with CrewAI and Groq"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai>=0.98.0",
    "crewai-tools>=0.32.0",
    "litellm==1.60.2",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
]

[project.scripts]
travel_planner = "travel_planner.main:run"
run_crew = "travel_planner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]

[tool.crewai]
type = "crew"
